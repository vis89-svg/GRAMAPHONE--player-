<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gramaphone</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div id="app">
        <nav id="nav" class="hidden">
            <div class="nav-brand">Gramaphone</div>
            <div class="nav-links">
                <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
                <button class="tab-btn" data-tab="search">Search</button>
                <button class="tab-btn" data-tab="playlists">Playlists</button>
                <button class="tab-btn" data-tab="profile">Profile</button>
                <button class="tab-btn" id="logout-btn">Logout</button>
            </div>
        </nav>

        <main>
            <section id="auth-page">
                <div class="auth-card">
                    <h1>Gramaphone</h1>
                    <p class="auth-subtitle">Personalized AI-powered music</p>
                    <form id="auth-form">
                        <input type="email" id="auth-email" placeholder="Email" required>
                        <input type="password" id="auth-password" placeholder="Password" required>
                        <button type="submit" id="auth-submit">Login</button>
                    </form>
                    <p class="auth-toggle">
                        <span id="auth-toggle-text">Don't have an account?</span>
                        <a href="#" id="auth-toggle-link">Register</a>
                    </p>
                    <p id="auth-error" class="error hidden"></p>
                </div>
            </section>

            <section id="dashboard-page" class="page hidden">
                <h2>Today's Blueprint</h2>
                <div id="dashboard-content">
                    <div id="blueprint-strategy" class="card"></div>
                    <div id="blueprint-stats" class="card"></div>
                    <div id="blueprint-tracks" class="card"></div>
                </div>
                <button id="refresh-blueprint" class="btn">Refresh Blueprint</button>
            </section>

            <section id="search-page" class="page hidden">
                <h2>Search Tracks</h2>
                <form id="search-form">
                    <input type="text" id="search-query" placeholder="Artist or track name" required>
                    <input type="text" id="search-album" placeholder="Album filter (optional)">
                    <button type="submit">Search</button>
                </form>
                <div id="search-results" class="results-grid"></div>
            </section>

            <section id="playlists-page" class="page hidden">
                <h2>Your Playlists</h2>
                <button id="new-playlist-btn" class="btn">+ New Playlist</button>
                <div id="new-playlist-form" class="hidden">
                    <input type="text" id="playlist-name" placeholder="Playlist name">
                    <input type="text" id="playlist-desc" placeholder="Description (optional)">
                    <button id="create-playlist">Create</button>
                    <button id="cancel-playlist">Cancel</button>
                </div>
                <div id="playlists-list"></div>
                <div id="playlist-detail" class="hidden">
                    <h3 id="playlist-detail-title"></h3>
                    <div id="playlist-tracks"></div>
                    <button id="back-to-playlists">Back</button>
                </div>
            </section>

            <section id="profile-page" class="page hidden">
                <h2>Listening Profile</h2>
                <div id="profile-stats" class="card"></div>
                <div id="profile-top-artists" class="card"></div>
                <div id="profile-genres" class="card"></div>
            </section>
        </main>

        <div id="youtube-player"></div>

        <div id="player-bar" class="hidden">
            <div class="player-left">
                <img id="player-art" src="" alt="">
                <div class="player-details">
                    <div id="player-title"></div>
                    <div id="player-artist"></div>
                </div>
            </div>
            <div class="player-center">
                <div class="player-buttons">
                    <button id="player-prev">⏮</button>
                    <button id="player-play-btn">▶</button>
                    <button id="player-next">⏭</button>
                </div>
                <div class="player-progress-wrap">
                    <span id="player-current">0:00</span>
                    <input type="range" id="player-progress" min="0" max="100" value="0">
                    <span id="player-duration">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <button id="player-close">✕</button>
            </div>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
